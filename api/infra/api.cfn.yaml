AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Open Proof Network protocol service (F05-R12; D-35): one Lambda function behind an HTTP API,
  three on-demand DynamoDB tables (identities, tokens, claims), the Parameter Store paths its
  secrets live in (C8 item 3), an execution role limited to exactly those tables and parameters,
  and a deploy role assumable only by this repository's api-deploy workflow through GitHub OIDC
  (C8 item 4). The stack is bootstrapped once by the founder (C8 item 5); every later deploy
  assumes the role from CI. The service holds no authority (D-35) and its tables are operational
  state (C9) — losing them is an outage, never a dispute.

Parameters:
  GitHubRepository:
    Type: String
    Default: thisisanameforsure/open_proof_network
    Description: owner/name of the network repository whose api-deploy workflow may deploy
  GitHubOwnerId:
    Type: Number
    Default: 3485173
    Description: the owner's numeric GitHub id (the sub claim is owner@id/repo@id; ids survive renames)
  GitHubRepositoryId:
    Type: Number
    Default: 1360351029
    Description: the network repository's numeric GitHub id
  GitHubBranch:
    Type: String
    Default: main
    Description: the branch the deploying workflow must run from
  CreateOidcProvider:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: create the token.actions.githubusercontent.com provider (the site stack made one)
  ParameterPrefix:
    Type: String
    Default: /opn/api/
    Description: Parameter Store path the function reads its secrets from (C8 item 3)
  GraphRepository:
    Type: String
    Default: thisisanameforsure/open_proof_network_graph
    Description: the graph whose committed frontier.json the claim routes read (D-35)
  UsesFrom:
    Type: String
    Default: ""
    Description: the network commit from which the gate reads use lines (F08-T26, Q39); a target pinned at or after it takes them, and empty means none does
  AnnexStepsFrom:
    Type: String
    Default: ""
    Description: the network commit from which the gate reads stepped annexes (F18-T5, annex/v2); a target pinned at or after it takes them, and empty means none does
  ApiDomain:
    Type: String
    Default: ""
    Description: the service's hostname, e.g. api.openproofnetwork.org; empty uses the issued one
  CertificateArn:
    Type: String
    Default: ""
    Description: an ACM certificate in this region covering ApiDomain
  HostedZoneId:
    Type: String
    Default: ""
    Description: the Route 53 zone holding ApiDomain
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: how long the function's CloudWatch logs are kept (they carry no token, C8)
  # F05-T22 (audit 2026-10-04): limits, alarms and a budget. Every number is a parameter, so the
  # owner tunes it with a change set rather than an edit.
  ThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: the HTTP API stage's burst limit for every route (requests at once)
  ThrottleRateLimit:
    Type: Number
    Default: 25
    MinValue: 1
    Description: the HTTP API stage's steady rate limit for every route (requests per second)
  ReservedConcurrency:
    Type: Number
    Default: 20
    MinValue: 1
    Description: the function's reserved concurrency, its ceiling; the account must keep 100 unreserved
  AlarmEmail:
    Type: String
    Default: ""
    Description: an address the alarm topic mails (it must confirm the subscription); empty subscribes none
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 1
    Description: the account's monthly cost budget in USD; forecast and actual overruns go to the topic
  Api4xxPerFiveMinutes:
    Type: Number
    Default: 500
    Description: 4xx answers in five minutes that raise the alarm (refusals are 4xx by design)
  InvocationsPerHour:
    Type: Number
    Default: 20000
    Description: function invocations in an hour that raise the alarm (a flood or a loop)
  PullRequestsPerHour:
    Type: Number
    Default: 60
    Description: pull requests the service opens in an hour that raise the alarm
  IdentitiesPerHour:
    Type: Number
    Default: 30
    Description: identities minted in an hour that raise the alarm

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasDomain: !Not [!Equals [!Ref ApiDomain, ""]]
  MakeDns: !And
    - !Not [!Equals [!Ref ApiDomain, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  IdentitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      # State nonces, identity proofs and rate counters carry expires_at and vanish on their own.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !Ref LogRetentionDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: the api function; nothing beyond its three tables and its parameters (C8)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${FunctionLogGroup.Arn}:*"
        - PolicyName: tables
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt IdentitiesTable.Arn
                  - !GetAtt TokensTable.Arn
                  - !GetAtt ClaimsTable.Arn
        - PolicyName: parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub
                  - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Path}*"
                  - Path: !Ref ParameterPrefix

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: the Open Proof Network protocol service (D-35); no authority of its own
      Runtime: python3.13
      Architectures: [arm64]
      Handler: opn_api.lambda_handler.handler
      Role: !GetAtt ExecutionRole.Arn
      MemorySize: 512
      # F05-T22: a ceiling on concurrent executions, so a flood is throttled, not billed.
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      # F05-T22: the service logs at INFO (the access line, "opened <pull request>"). Under the
      # plain-text default Lambda keeps only WARN and above, and basicConfig is a no-op beside the
      # runtime's own handler, so the metric filters would match nothing. JSON at INFO keeps them.
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      # F13-T13: under the HTTP API's 30 s integration ceiling, and above the fast check's whole
      # budget (slot wait + connect + 20 s + grace), so the service answers and is never killed.
      Timeout: 29
      Code:
        # Replaced on the first api-deploy run; this placeholder only lets the stack create.
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": '{"error":"not-deployed"}'}
      Environment:
        Variables:
          OPN_API_STORE: dynamodb
          OPN_API_TABLE_IDENTITIES: !Ref IdentitiesTable
          OPN_API_TABLE_TOKENS: !Ref TokensTable
          OPN_API_TABLE_CLAIMS: !Ref ClaimsTable
          OPN_API_PARAMETER_PREFIX: !Ref ParameterPrefix
          OPN_API_GRAPH_REPO: !Ref GraphRepository
          # F08-T26: a target's network pin is compared by ancestry in this repository
          OPN_API_NETWORK_REPO: !Ref GitHubRepository
          OPN_API_USES_FROM: !Ref UsesFrom
          # F18-T5: a stepped annex (annex/v2) is taken where the target's pin descends from this
          OPN_API_ANNEX_STEPS_FROM: !Ref AnnexStepsFrom
          # R3: the OAuth redirect_uri must match the address the browser actually used.
          OPN_API_PUBLIC_URL: !If
            - HasDomain
            - !Sub "https://${ApiDomain}"
            - !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http"
      Description: the plain HTTP path of D-28's tool surface; reads unauthenticated, writes bearer
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # F05-T22: every route is throttled at the edge, before the function is invoked.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
        ThrottlingRateLimit: !Ref ThrottleRateLimit

  # F05-T22: the alias a versioned deploy will move. It points at $LATEST and the integration
  # still targets the unqualified function: a published version freezes the environment, so a
  # change set that sets UsesFrom or AnnexStepsFrom would not reach an alias on a version until
  # the next code deploy. Moving the integration onto it is its own task (README, "The live alias").
  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref Function
      FunctionVersion: $LATEST
      Description: the version the service answers from once deploys publish one (F05-T22)

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref ApiDomain
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref Stage

  ApiDns:
    Type: AWS::Route53::RecordSetGroup
    Condition: MakeDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Comment: the Open Proof Network protocol service (D-35)
      RecordSets:
        - Name: !Ref ApiDomain
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApiDomainName.RegionalDomainName
            HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId
            EvaluateTargetHealth: false

  # F05-T22: one topic for every alarm and the budget; mail is optional and must be confirmed.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      DisplayName: OPN api alarms

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      # A topic policy replaces SNS's default one, so both publishers are named here.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: Budgets
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: the HTTP API answered an unusual number of 4xx (refusals, 429s, probing)
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Api4xxPerFiveMinutes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: the HTTP API answered 5xx (the function failed, timed out or was throttled)
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: the function hit its reserved concurrency
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: the function raised or timed out (an answered 4xx/5xx is not an error here)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: the function ran an unusual number of times in an hour (a flood or a loop)
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref InvocationsPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The service writes "<kind> <id> opened <html_url> for <identity>" when it opens a pull request
  # (submissions, proposals, appends), and the html_url carries /pull/.
  PullRequestsOpenedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogGroup
      FilterPattern: '"opened" "/pull/"'
      MetricTransformations:
        - MetricNamespace: OPN/api
          MetricName: PullRequestsOpened
          MetricValue: "1"
          DefaultValue: 0

  # No line names a minted identity; the access line does: "POST identity:post_tokens
  # identity=- status=201 ms=…", and POST /tokens answers 201 only when it created one.
  IdentitiesMintedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FunctionLogGroup
      FilterPattern: '"identity:post_tokens" "status=201"'
      MetricTransformations:
        - MetricNamespace: OPN/api
          MetricName: IdentitiesMinted
          MetricValue: "1"
          DefaultValue: 0

  PullRequestsOpenedAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: PullRequestsOpenedFilter
    Properties:
      AlarmDescription: the service opened an unusual number of pull requests on the graph in an hour
      Namespace: OPN/api
      MetricName: PullRequestsOpened
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref PullRequestsPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  IdentitiesMintedAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: IdentitiesMintedFilter
    Properties:
      AlarmDescription: the service minted an unusual number of identities in an hour
      Namespace: OPN/api
      MetricName: IdentitiesMinted
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref IdentitiesPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The whole account's monthly cost, not this stack's alone (nothing is tagged per stack).
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlarmTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-deploy"
      Description: assumed only by the network repo's api-deploy workflow (C8 item 4)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                    Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
      Policies:
        - PolicyName: deploy-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The code only. No permission over the tables, the parameters or any other role.
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:PublishVersion
                Resource: !GetAtt Function.Arn

Outputs:
  ApiUrl:
    Description: the service's origin (the domain when set, else the issued address)
    Value: !If
      - HasDomain
      - !Sub "https://${ApiDomain}"
      - !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ClaimsUrl:
    Description: what the graph's post-merge job reads as OPN_API_CLAIMS_URL (F05-R10)
    Value: !If
      - HasDomain
      - !Sub "https://${ApiDomain}/claims.json"
      - !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/claims.json"
  IssuedApiUrl:
    Description: the generated address, which keeps working alongside the domain
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Value: !Ref Function
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ParameterPrefix:
    Value: !Ref ParameterPrefix
  IdentitiesTableName:
    Value: !Ref IdentitiesTable
  TokensTableName:
    Value: !Ref TokensTable
  ClaimsTableName:
    Value: !Ref ClaimsTable
  AlarmTopicArn:
    Description: the topic every alarm and the budget publish to (F05-T22)
    Value: !Ref AlarmTopic
