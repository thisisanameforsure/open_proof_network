# CI for the `network` repo (conventions §2): both verification tiers on every push and PR.
# Nothing here has authority over any graph (D-35); a graph pins a commit of this repo by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: make verify (fast tier)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - run: make verify

  verify-lean:
    name: make verify-lean (real toolchain + sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install the pinned Lean toolchain
        run: |
          if [ -x gate/scripts/install-toolchain.sh ]; then
            gate/scripts/install-toolchain.sh
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          else
            echo "::notice::gate/scripts/install-toolchain.sh not present yet (F00-T2)"
          fi
      # F11-R6: the lean tier runs the on-ramp fixture on the Mathlib commit gate/mathlib-pins.txt
      # names; the checkout with its oleans is several GiB, so it is cached on the pins file and
      # installed by the same script a laptop runs. The docker tier builds the Mathlib image on
      # top (a hosted runner is what §6's budget is measured on), which needs the room the
      # runner's preinstalled toolchains occupy.
      - name: Cache the pinned Mathlib checkouts
        id: mathlib-cache
        uses: actions/cache@v4
        with:
          path: ~/.opn/mathlib
          key: mathlib-${{ hashFiles('gate/mathlib-pins.txt') }}
      - name: Install the pinned Mathlib checkouts (on a cache miss)
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sed -e 's/#.*//' -e 's/[[:space:]]//g' gate/mathlib-pins.txt | grep -E '^[0-9a-f]{40}$' | while read -r sha; do
            gate/scripts/install-mathlib.sh "$sha"
          done
      - name: Make room for the Mathlib image
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - run: make verify-lean

  verify-harness:
    # F16-T8, R8: each connector against its real harness binary (level 2). The binaries come
    # from gate/clients/harness/package-lock.json with their integrity hashes; they run with a
    # throwaway HOME against the api served on loopback over the fake host, and the job holds no
    # secret, so a check that needs a credential (Copilot) is reported not attempted (F16-Q5).
    name: make verify-harness (connectors against real harness binaries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install the pinned harness binaries
        run: npm ci --prefix gate/clients/harness --no-audit --no-fund
      - name: Level 2 (pytest -m harness)
        env:
          OPN_HARNESS_BIN: ${{ github.workspace }}/gate/clients/harness/node_modules/.bin
        run: make verify-harness
      - name: The runner's report, with every check not attempted and why
        if: always()
        run: |
          uv run --frozen python gate/tools/harness_check.py \
            --bin-dir gate/clients/harness/node_modules/.bin --out harness-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: harness-report.json
