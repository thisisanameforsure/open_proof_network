# F16-T8, R11: the connectors against each harness's latest release, weekly. Harness CLIs change
# month to month and a snippet that worked can stop working without any change here; this job
# runs the level-2 check twice, at the pins in gate/clients/harness/package-lock.json and at each
# package's latest version, and goes red naming the harness and both versions when the latest
# fails where the pin passes. It writes nothing: moving a pin is a commit that carries a passing
# run (F16-R11). It holds no secret.
name: harness-drift

on:
  schedule:
    - cron: "41 5 * * 1"  # weekly, Monday; the minute is arbitrary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.22.2"
      - name: The pinned binaries
        run: npm ci --prefix gate/clients/harness --no-audit --no-fund
      - name: The latest binaries
        run: |
          mkdir -p "$RUNNER_TEMP/latest"
          npm install --prefix "$RUNNER_TEMP/latest" --no-audit --no-fund \
            @anthropic-ai/claude-code@latest @github/copilot@latest \
            @google/gemini-cli@latest @openai/codex@latest
      - name: Level 2 at the pins
        run: |
          uv run --frozen python gate/tools/harness_check.py \
            --bin-dir gate/clients/harness/node_modules/.bin --out pinned.json || true
      - name: Level 2 at the latest releases
        run: |
          uv run --frozen python gate/tools/harness_check.py \
            --bin-dir "$RUNNER_TEMP/latest/node_modules/.bin" --out latest.json || true
      - name: A check the pin passes and the latest fails is a regression
        run: uv run --frozen python gate/tools/harness_check.py --compare pinned.json latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-drift
          path: |
            pinned.json
            latest.json
