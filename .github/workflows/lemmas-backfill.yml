# F08-T41 (D-12 v3.38): write the lemma edges of the partials merged before v3.38, and hand the
# curator the files.
#
# Before v3.38 a hole that restated a node under another branch of its target recorded no edge
# (F07-R22, v3.19), so the merged assembly could never be used and the restatement reached only
# the post-merge job's log. `opn-gate lemmas-backfill` re-extracts every merged partial of a target
# by the same steps (1, 2 and 4 in the step-3 sandbox) and writes, into the checkout, the META.yaml
# `lemmas` entries (meta/v6) and the regenerated Context.lean of each parent whose hole restated a
# cross-branch sibling. Idempotent: a parent that already carries the edge is reported unchanged.
# It is run once, after the re-pin that carries F07-T77, and again only if a graph is rebuilt.
#
# Why here and not on a laptop: a Mathlib target's step-3 image is 3.5 GiB compressed and the
# founder's machine has room for one build at most (engineering/CLAUDE.md, 2026-09-12).
#
# Why in the `network` repository: it has no authority over any graph (D-35). It clones the graph
# read-only, re-extracts in the sandbox, and uploads the changed files as an artifact. Committing
# them, with the re-rendered products, is the curator's act, by hand, after reading them — and it
# is a curator commit, since META.yaml is path-forbidden to every submission.
#
# Contributor Lean runs only in the step-3 image each target pins by digest (C9, D-4 step 3) —
# pulled, never built, so a wrong pin fails loudly instead of extracting something else.
#
# No secret and no write permission (C8): `contents: read`, nothing else; the graph is public.
name: lemmas backfill

on:
  workflow_dispatch:
    inputs:
      graph_ref:
        description: "the graph commit to read (default: main's tip)"
        required: false
        type: string
      target:
        description: "backfill only this target id (default: every target)"
        required: false
        type: string

permissions:
  contents: read

env:
  GRAPH_REPO: https://github.com/thisisanameforsure/open_proof_network_graph

jobs:
  backfill:
    name: lemma edges of the partials merged before v3.38
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: network

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Clone the graph (read-only; D-35)
        env:
          REF: ${{ inputs.graph_ref }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$GRAPH_REPO" graph
          if [ -n "$REF" ]; then git -C graph checkout --quiet --detach "$REF"; fi
          echo "reading graph $(git -C graph rev-parse HEAD)"

      - name: Make room for the Mathlib image
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Backfill every target
        env:
          ONLY: ${{ inputs.target }}
          PYTHONPATH: network/gate
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -t targets < <(
            python3 - "$ONLY" <<'PY'
          import json, sys
          only = (sys.argv[1] or "").strip()
          doc = json.load(open("graph/targets/index.json"))
          for row in doc.get("targets") or []:
              tid = row.get("target_id")
              if tid and (not only or tid == only):
                  print(tid)
          PY
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no targets to backfill (is the target a live id?)"
            exit 1
          fi
          commit="$(git -C graph rev-parse HEAD)"
          {
            echo "## Lemmas backfill"
            echo
            echo "Graph at \`${commit:0:12}\`, network at \`$(git -C network rev-parse --short HEAD)\`."
            echo
            echo "| target | written | unchanged | failed |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failures=0
          for tid in "${targets[@]}"; do
            image="$(python3 -c 'import json,sys; print(json.load(open(f"graph/targets/{sys.argv[1]}/gate-spec.json")).get("devcontainer_ref") or "")' "$tid")"
            if [ -z "$image" ]; then
              echo "| \`$tid\` | &mdash; | &mdash; | its gate-spec.json pins no image |" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              continue
            fi
            if [ "$image" != "${previous:-}" ]; then
              # One image on disk at a time: the runner holds one Mathlib image, and most targets
              # share one, so it is pulled once and kept while the pin is the same.
              if [ -n "${previous:-}" ]; then docker image rm --force "$previous" > /dev/null 2>&1 || true; fi
              docker pull --quiet "$image"
              previous="$image"
            fi
            echo "::group::lemmas $tid"
            set +e
            uv run --frozen --project network python -m opn_gate.cli lemmas-backfill \
              --graph graph --target "$tid" \
              --image "$image" --no-build --out "out/$tid" > "summary-$tid.json" 2> "summary-$tid.err"
            code=$?
            set -e
            cat "summary-$tid.json" "summary-$tid.err" || true
            echo "::endgroup::"
            row="$(python3 -c 'import json,sys
          try: d = json.load(open(sys.argv[1]))
          except Exception: print("| `%s` | error | &mdash; | see the log |" % sys.argv[2]); raise SystemExit
          print("| `%s` | %d | %d | %d |" % (sys.argv[2], len(d.get("written") or []), len(d.get("unchanged") or []), len(d.get("failed") or [])))' "summary-$tid.json" "$tid")"
            echo "$row" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          # The files the command wrote into the checkout are what the curator commits.
          git -C graph status --porcelain > changed-files.txt || true
          mkdir -p edges
          while IFS= read -r line; do
            rel="${line:3}"
            if [ -n "$rel" ] && [ -f "graph/$rel" ]; then
              mkdir -p "edges/$(dirname "$rel")"
              cp "graph/$rel" "edges/$rel"
            fi
          done < changed-files.txt
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures target(s) had a partial that could not be re-extracted; the edges hold every one that was"
            exit 1
          fi

      - name: Keep the edges and the summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lemma-edges
          path: |
            edges/
            changed-files.txt
            summary-*.json
            summary-*.err
          include-hidden-files: true
          if-no-files-found: warn
