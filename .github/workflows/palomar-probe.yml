# F25-T2: the Comparator and module-system probes, on a Linux runner at Palomar's toolchain.
# Dispatch by hand; every answer is evidence (engineering/evidence/F25/probes.txt), so the job
# fails only when a probe could not be asked. Core Lean only: no Mathlib, minutes not hours.
name: palomar-probe
on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Lean toolchain to probe with (Palomar's minimum is v4.35.0-rc2)"
        default: "leanprover/lean4:v4.35.0-rc2"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bubblewrap (Comparator's sandbox) and elan
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the toolchain under probe
        run: |
          elan toolchain install "${{ inputs.toolchain }}"
          elan default "${{ inputs.toolchain }}"
          lean --version
          ls "$(lean --print-prefix)/bin"
      - name: Run the probes
        run: |
          sed -i "s|^TOOLCHAIN = .*|TOOLCHAIN = \"${{ inputs.toolchain }}\"|" gate/tools/palomar_probe.py
          python3 gate/tools/palomar_probe.py --out probes
          cat probes/toolchain.txt
          cat probes/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: palomar-probes
          path: probes/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: palomar-probes-summary
          path: probes/summary.json
