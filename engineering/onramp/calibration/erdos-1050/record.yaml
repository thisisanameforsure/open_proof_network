id: erdos-1050
title: 'Erdős problem 1050 (calibration): a known result'
informal: '**Erdős Problem 1050.** The series $\sum_{n=1}^\infty \frac{1}{2^n - 3}$
  is irrational. The source sum runs over $n \ge 1$; as a `tsum` over `ℕ` (which starts
  at $0$) it is reindexed $n \mapsto n + 1$, i.e. $\sum_{n=0}^\infty 1/(2^{n+1} -
  3)$.'
