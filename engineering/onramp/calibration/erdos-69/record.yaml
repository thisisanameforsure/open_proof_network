  summary: 'A known result, on the calibration track (Stages v3.17, F15-R14): solved
    in the literature by P. Erdős, On arithmetical properties of Lambert series, J.
    Indian Math. Soc. 12 (1948), 63-66, with no Lean proof at registry commit c7f31d5fd3d2
    (erdosproblems.com status PROVED, standing since 1948). Graded medium: The irrationality
    of the sum of omega(n)/2^n, with omega the number of distinct prime divisors,
    a Mathlib arithmetic function; the registry files it as textbook. The route is
    two lemmas — the Lambert-series identity sum omega(n)/2^n = sum over primes p
    of 1/(2^p - 1), a rearrangement of absolutely convergent series, and Erdős''s
    1948 irrationality argument for the prime sum — each ordinary analysis with no
    known Lean proof, so the agent has to decompose and prove rather than transcribe.
    Drafted by docs/calibration_pool.py and read by the curator before intake.'
