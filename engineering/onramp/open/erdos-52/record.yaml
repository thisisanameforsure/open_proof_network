qa_summary: 'Hand QA pass 2026-09-12 (engineering/evidence/F11/open-targets.md): the Lean statement back-translates
  to — For each ε in (0,1) there is C>0 such that every finite set of integers has max(|A+A|, |A·A|) ≥
  C·|A|^(2−ε). — which matches erdosproblems.com/52; no hypothesis is vacuous; licence Apache-2.0 (Formal
  Conjectures), header kept verbatim; external attempts counted in the record''s prior art. Grade mechanical-only
  until a non-author signs it (D-9).'
