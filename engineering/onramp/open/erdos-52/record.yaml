prior_art:
  arxiv_query: null
  forum_url: https://www.erdosproblems.com/52
  summary: Open since 1977 (Erdős–Szemerédi; $500). The best exponent known is 4/3 + c (Solymosi 2009,
    Konyagin–Shkredov 2016 and successors), far from 2. Attempted by AlphaProof Nexus (Feb 2026), not
    solved; Bloom top-10 selection; an AI solution to a *variant* is recorded on the AI-contributions
    wiki (Claude Mythos, 3 June 2026), not to this statement; erdos_52 in Formal Conjectures since 2026-04-17,
    no misformalization issue (trust A).
