schema: target/v1
id: erdos-52
title: 'Erdős problem 52: the sum-product conjecture'
informal: null
paraphrase: Whether for every ε>0 a finite set of integers has either its sumset or its product set of
  size at least a constant times |A|^(2−ε).
track: open
source:
  kind: formal-conjectures
