schema: target/v3
id: schanuel-conjecture
title: Schanuel's Conjecture
informal: Given any set of $n$ complex numbers $\{z_1, ..., z_n\}$ that are linearly
  independent over $\mathbb{Q}$, the field extension $\mathbb{Q}(z_1, ..., z_n, e^{z_1},
  ..., e^{z_n})$ has transcendence degree at least $n$ over $\mathbb{Q}$.
