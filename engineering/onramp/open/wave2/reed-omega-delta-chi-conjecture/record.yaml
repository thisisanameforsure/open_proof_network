id: reed-omega-delta-chi-conjecture
title: Reed's omega, delta, and chi conjecture
informal: For a graph $G$, we define $\Delta(G)$ to be the maximum degree, $\omega(G)$
  to be the size of the largest clique subgraph, and $\chi(G)$ to be the chromatic
  number. Reed's omega, delta, and chi conjecture states that $$\chi(G) \leq \lceil
  \frac{1}{2}(\omega(G) + \Delta(G) + 1) \rceil.$$
