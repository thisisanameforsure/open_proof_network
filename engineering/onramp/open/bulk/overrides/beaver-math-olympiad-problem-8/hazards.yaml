- checker: int-trunc
  location: b n / 2
  justification: "`b n / 2` is the problem's ⌊b_n/2⌋ in the branch test `a_n > ⌊b_n/2⌋` and in `a_n - ⌊b_n/2⌋ - 3`, because the registry's recurrence carries the floor explicitly and Lean's ℤ-division by 2 is floor division."
