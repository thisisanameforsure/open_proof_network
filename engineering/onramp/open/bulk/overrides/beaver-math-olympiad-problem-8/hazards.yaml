- checker: int-trunc
  location: (b n + 1) / 2
  justification: "`(b n + 1) / 2` on ℤ is the problem's own ⌊(b_n+1)/2⌋, because the informal statement writes the recurrence with explicit floors and Lean's `/` on ℤ with the positive divisor 2 is floor division (Euclidean division rounds toward -∞ for a positive divisor), so the two agree for every integer b_n, negative included."
