- checker: div-zero
  location: ↑(primeGap n) / Real.log ↑n
  justification: '`primeGap n / log n` is the problem''s own quotient `(p_{n+1} - p_n) / log n`; `Real.log n = 0` only at n = 0 and n = 1, so the quotient is Lean''s 0 for those two integers only, and `HasDensity` (a limit of partial densities at atTop) is unchanged by the membership of finitely many integers, so the density and its continuity in c mean what the informal text means.'
