- checker: off-by-one-range
  location: "n > 1"
  justification: "∀ n > 1, ∃ k, gcd n (a k) = 1 is the problem's 'no integer has a common factor with every term': a common factor is an integer n ≥ 2 (n = 1 divides everything trivially and n = 0 has gcd (0, a k) = a k, which would read as a common factor with every term), so n > 1 is exactly the registry's quantifier."
