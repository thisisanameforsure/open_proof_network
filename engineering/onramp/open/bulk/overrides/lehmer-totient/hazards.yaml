- checker: nat-sub
  location: n - 1
  justification: '`n - 1` is the problem''s n - 1 and never truncates because the statement carries `n > 1`, so n - 1 ≥ 1 as an integer.'
- checker: off-by-one-range
  location: n > 1
  justification: '`n > 1` is the problem''s own ''composite number n > 1'', so the strict boundary is the stated one.'
