- checker: div-zero
  location: -Real.log (Erdos311.delta N) / ↑N
  justification: The divisor `N` is zero only at N = 0, one term of a sequence whose `Tendsto ... atTop` is unchanged by finitely many terms; and `delta N` is positive for every N (it is the infimum of a finite nonempty set of positive reals — the subsets of {1..N} are finitely many and the empty set contributes 1 — so the minimum is attained and nonzero), so `-log (delta N) / N` is the informal text's own `-log δ(N) / N → c`.
