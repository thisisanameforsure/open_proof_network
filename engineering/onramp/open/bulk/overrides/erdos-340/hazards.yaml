- checker: div-zero
  location: √↑n / ↑n ^ ε
  justification: '`√n / n^ε` is n^{1/2-ε}, the problem''s lower-bound scale |A ∩ {1..N}| ≫ N^{1/2-ε}, because ε > 0 is a hypothesis and the division is a real power on n ≥ 1; the only zero denominator is n = 0 (0^ε = 0 for ε > 0), a single point that =O[atTop] ignores.'
