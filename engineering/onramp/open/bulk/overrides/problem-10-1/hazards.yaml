- checker: off-by-one-range
  location: "1 < |α|"
  justification: "1 < |α| is the registry's own range: the problem notes the question is 'trivial for |α| < 1' (ξ α^n → 0 outright), and |α| = 1 is impossible for a real transcendental α (α = ±1 is rational), so the strict bound excludes exactly the trivial and impossible cases and asks the question for the one range where it is open."
