- checker: div-zero
  location: ε / α
  justification: '`ε / α` is the problem''s interval length ε/α. In the instances that carry the claim the divisor is positive: the statement quantifies `∀ M, ∃ α, M < α`, and any instance with M ≤ 0 is implied by the instance M = 1 (whose α exceeds 1 and works for every smaller M), so the proposition is equivalent to the one restricted to M > 0, where α > M > 0 and Lean''s division is the real quotient; the convention at α = 0 never changes the truth value.'
