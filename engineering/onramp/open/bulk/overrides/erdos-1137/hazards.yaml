- checker: div-zero
  location: ↑((Finset.range x).sup fun n => primeGap n * primeGap (n - 1)) / ↑((Finset.range x).sup primeGap) ^ 2
  justification: '`↑((Finset.range x).sup fun n => primeGap n * primeGap (n - 1)) / ↑((Finset.range x).sup primeGap) ^ 2` is the problem''s max_{n<x} d_n d_{n-1} / (max_{n<x} d_n)^2, because primeGap n = nth Prime (n+1) - nth Prime n ≥ 1 for every n (consecutive primes are distinct, so no truncation), hence for every x ≥ 1 the sup over the nonempty range is ≥ 1 and the denominator is positive; it is zero only at x = 0, which cannot affect the limit as x → ∞. (The n = 0 term''s truncated index gives d_0 d_0 = 1, which never exceeds the later terms, so the numerator agrees with the informal max.)'
