- checker: div-zero
  location: "\↑(Erdos408.f n) / Real.log \↑n"
  justification: "(f n : ℝ) / Real.log n has a zero divisor only at n = 0 and n = 1 (log 0 = log 1 = 0), where Lean's quotient is 0; the claim is about the natural density of {n : f(n)/log n ≤ c}, which two integers cannot change, and the registry's own text says so: 'for n ≤ 1 the quotient is 0 in Lean, which does not affect densities'. For n ≥ 2, log n > 0."
