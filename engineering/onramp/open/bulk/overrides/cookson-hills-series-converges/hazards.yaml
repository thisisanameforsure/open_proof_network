- checker: div-zero
  location: 1 / ((↑n + 1) ^ 3 * Real.cos (↑n + 1) ^ 2)
  justification: 'The divisor `(n+1)^3 * cos(n+1)^2` is never zero: `n + 1 ≥ 1` is a positive integer, and `Real.cos` vanishes only at odd multiples of π/2, which are irrational, so `cos (n+1) ≠ 0` for every natural n. The term is therefore the problem''s `sec(n)^2 / n^3` summed from n = 1 exactly, with no appeal to Lean''s division-by-zero convention.'
