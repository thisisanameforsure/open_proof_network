- checker: div-zero
  location: (-1) ^ (k + 1) * (↑k + 1) / ↑(Nat.nth Nat.Prime k)
  justification: The divisor ↑(Nat.nth Nat.Prime k) is the k-th prime p_{k+1} (0-indexed, as the record says), which is ≥ 2 > 0 for every k, so the division is the problem's n/p_n with n = k+1 and never hits Lean's x/0.
