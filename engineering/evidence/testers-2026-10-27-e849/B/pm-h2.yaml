  n k m l : ℕ
  hk : 2 ≤ k
  hn : 2 * k ≤ n
  hl : 2 ≤ l
  hm : 2 * l ≤ m
  hkl : k < l
  hc : n.choose k = m.choose l
  ⊢ (k = 2 ∧ l = 3 ∨ k = 2 ∧ l = 4 ∨ k = 2 ∧ l = 5 ∨ k = 2 ∧ l = 6 ∨ k = 2 ∧ l = 8 ∨
