detail: >
  Two levels merged: #1177 (this node keeps only its lower disjunct, child --h6--h1: fract(F_N) <= 1 - 1/N
  infinitely often) and #1207 (that child from S's digits, with --h5 as a lemma: child --h6--h1--h2,
  2/(N+1) <= fract(N! S) < 1 - 1/(N+1) infinitely often). Write S = sum_m a_m/m! with 0 <= a_m <= m-1, so
  fract(N! S) = (a_{N+1} + fract((N+1)! S))/(N+1). The root says the digits a_m are not eventually 0 (nor
  eventually m-1); this node says the same (it is equivalent to the root). --h6--h1 is implied by
  "a_m in [2, m-2] infinitely often" and implies "a_m >= 2 infinitely often"; --h6--h1--h2 says
  "a_{N+1} in [2, N-1] infinitely often". Known order: A1 (--h3--h2) => --h6--h1--h2 => --h6--h1 => root, and
  --h3 => --h6--h1. No reverse is known: a real whose digits alternate 1 and m-1 satisfies --h6--h1 at
  every other N and --h6--h1--h2 at none. Every one of these cores (and --h3) also forces S - e to be
  irrational, i.e. T = sum_{n>=2} 1/(n!(n!-1)) irrational, since S - e rational makes the digits eventually 1;
  the root alone does not. That is the shared barrier: proving any of them proves more than the problem
  asks, about a series no better understood. Also tried and dropped: truncating F_N at n ~ N/2 + N/log N
  (the top terms sum to < 1/N; the core is --h3 with a 1/N slack, the same question), the recurrence
  x_{N+1} = fract((N+1) x_N + 1/((N+1)!-1)) (equivalent restatements only), and N = p - 1 with Wilson
  (p divides (p-2)! - 1, which controls denominators, never the size of fract(F_N)).
