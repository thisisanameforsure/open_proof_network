version: v0.4
project:
  name: 'Erdős problem 1050 (calibration): a known result'
  description: '**Erdős Problem 1050.** The series $\sum_{n=1}^\infty \frac{1}{2^n - 3}$ is irrational.
    The source sum runs over $n \ge 1$; as a `tsum` over `ℕ` (which starts at $0$) it is reindexed $n
    \mapsto n + 1$, i.e. $\sum_{n=0}^\infty 1/(2^{n+1} - 3)$.'
  authors:
  - calib-1050-fable
  - h0924-1050-http
  - t0924-1050-mcp
  - t0929-1
  - t1001-1050a
  - tester-1050-2045
  license: Apache-2.0
  responsible_maintainers:
  - thisisanameforsure
repository:
  role: substantive-development
classification:
