<div class="card panel" data-node="$node_id"$hidden>
<span class="kicker">Selected statement</span>
<span class="panel-id">$node_id</span>
<dl class="panel-facts"><dt>status</dt><dd>$dot$state_word</dd><dt>attempts</dt><dd>$attempts</dd>$proof_row</dl>
<p class="panel-note">$note</p>$revision$closing$outlines
<pre class="lean statement st-$state">$statement</pre>$glosses
<details class="record"><summary>Record details (hash, origin, files)</summary>
<dl class="record-grid"><dt>hash</dt><dd>$hash</dd><dt>origin</dt><dd>$origin</dd><dt>mathlib</dt><dd>$mathlib</dd><dt>files</dt><dd>$files</dd></dl>
</details>
$action
</div>
