# F16-R1: the connector registry, one entry per coding-agent harness a contributor may drive the
# network through. Network configuration, never graph content (D-35): the site's Docs page and the
# guide's generated section render it, the gate never reads it (D-1). A connector is a client of
# the plain protocol and adds no capability (D-28, F16-R13).
#
# Templates name no host (F16-R2). They may use only these placeholders:
#   {{mcp_url}}    the service's MCP endpoint, filled from the renderer's configured URL
#   {{server}}     the server name every entry registers, `server` below
#   {{token_env}}  the environment variable holding the write token, `token_env` below
#   {{prompt}}     headless templates only: the task given to the agent
# Every fact below comes from docs/research_harnesses_2026-09.html (read 2026-09-24) and carries
# its source; `verified` stays null until a level-2 run passes (F16-R8, R10).
schema: harness-clients/v1
server: open-proof-network
token_env: OPN_TOKEN
entries:
  - id: claude-code
    name: Claude Code
    transport: streamable-http
    snippets:
      - title: Register the server (reads, and the anonymous tutorial precheck)
        kind: command
        format: shell
        auth: none
        template: claude mcp add --transport http {{server}} {{mcp_url}}
      - title: Or commit it with the project, read by Claude Code, the Copilot CLI and VS Code
        kind: file
        path: .mcp.json
        scope: project
        format: json
        auth: none
        required_keys: [mcpServers.*.type, mcpServers.*.url]
        template: '{"mcpServers": {"{{server}}": {"type": "http", "url": "{{mcp_url}}"}}}'
      - title: With your write token, expanded by Claude Code at start-up
        kind: file
        path: .mcp.json
        scope: project
        format: json
        auth: bearer
        required_keys: [mcpServers.*.type, mcpServers.*.url, mcpServers.*.headers]
        template: >-
          {"mcpServers": {"{{server}}": {"type": "http", "url": "{{mcp_url}}",
          "headers": {"Authorization": "Bearer ${{{token_env}}}"}}}}
    instructions:
      reads_agents_md: false
      how: >-
        Claude Code reads CLAUDE.md, not AGENTS.md, so start the session with "Read AGENTS.md in
        the graph clone first".
    headless:
      template: claude -p "{{prompt}}" --allowedTools "mcp__{{server}}"
      approve: --allowedTools names the server; headless mode denies any other MCP call.
    list_check:
      template: claude mcp list
      expect: Connected
    profile:
      name_format: mcp__{server}__{tool}
      name_pattern: ^[A-Za-z0-9_-]+$
      result_cap_tokens: 25000
      sources:
        - url: https://code.claude.com/docs/en/mcp
          accessed: 2026-09-24
          claim: >-
            MAX_MCP_OUTPUT_TOKENS defaults to 25,000; names are sanitised to [A-Za-z0-9_-];
            an .mcp.json entry needs "type": "http"
        - url: https://code.claude.com/docs/en/headless
          accessed: 2026-09-24
          claim: a --mcp-config entry with url and no type is skipped and the run still exits 0
    verified: null

  - id: codex-cli
    name: OpenAI Codex CLI
    transport: streamable-http
    snippets:
      - title: Register the server (reads, and the anonymous tutorial precheck)
        kind: command
        format: shell
        auth: none
        template: codex mcp add {{server}} --url {{mcp_url}}
      - title: With your write token, read from the environment on every request
        kind: command
        format: shell
        auth: bearer
        template: codex mcp add {{server}} --url {{mcp_url}} --bearer-token-env-var {{token_env}}
      - title: Or in the user config, which also lets codex exec call the write tools
        kind: file
        path: ~/.codex/config.toml
        scope: user
        format: toml
        auth: bearer
        required_keys:
          - mcp_servers.*.url
          - mcp_servers.*.bearer_token_env_var
          - mcp_servers.*.default_tools_approval_mode
        template: |
          [mcp_servers.{{server}}]
          url = "{{mcp_url}}"
          bearer_token_env_var = "{{token_env}}"
          default_tools_approval_mode = "approve"
    instructions:
      reads_agents_md: true
      how: Codex reads AGENTS.md from the project root down; nothing to add.
    headless:
      template: codex exec "{{prompt}}"
      approve: >-
        codex exec never asks, so an MCP call that needs approval is denied. Read tools carry
        readOnlyHint and run; write tools need default_tools_approval_mode = "approve".
    list_check:
      template: codex mcp list
      expect: '{{server}}'
    profile:
      name_format: mcp__{server}__{tool}
      max_name_length: 128
      requires_readonly_hint: true
      sources:
        - url: https://github.com/openai/codex/blob/61e23bc/codex-rs/core/src/mcp_tool_call.rs
          accessed: 2026-09-24
          claim: >-
            under approval policy never, a call needing approval is denied; readOnlyHint true
            needs no approval in auto mode; mode approve never requires it
        - url: https://github.com/openai/codex/blob/61e23bc/codex-rs/codex-mcp/src/tools.rs
          accessed: 2026-09-24
          claim: MAX_TOOL_NAME_LENGTH is 128 with the mcp__ prefix and __ delimiter
        - url: https://github.com/openai/codex/blob/61e23bc/codex-rs/config/src/mcp_types.rs
          accessed: 2026-09-24
          claim: url, bearer_token_env_var and default_tools_approval_mode are server fields
    verified: null

  - id: gemini-cli
    name: Google Gemini CLI
    transport: streamable-http
    snippets:
      - title: Register the server in the project (reads, and the anonymous tutorial precheck)
        kind: command
        format: shell
        auth: none
        template: gemini mcp add --transport http {{server}} {{mcp_url}}
      - title: Or write the project settings, which also point Gemini at AGENTS.md
        kind: file
        path: .gemini/settings.json
        scope: project
        format: json
        auth: none
        required_keys: [mcpServers.*.httpUrl, context.fileName]
        forbidden_keys: [mcpServers.*.url]
        template: >-
          {"mcpServers": {"{{server}}": {"httpUrl": "{{mcp_url}}"}},
          "context": {"fileName": ["AGENTS.md", "GEMINI.md"]}}
      - title: With your write token (header expansion is undocumented; see Q3)
        kind: file
        path: .gemini/settings.json
        scope: project
        format: json
        auth: bearer
        required_keys: [mcpServers.*.httpUrl, mcpServers.*.headers, context.fileName]
        forbidden_keys: [mcpServers.*.url]
        template: >-
          {"mcpServers": {"{{server}}": {"httpUrl": "{{mcp_url}}",
          "headers": {"Authorization": "Bearer ${{{token_env}}}"}}},
          "context": {"fileName": ["AGENTS.md", "GEMINI.md"]}}
    instructions:
      reads_agents_md: false
      how: Gemini reads GEMINI.md unless context.fileName lists AGENTS.md, which the settings do.
    headless:
      template: gemini -p "{{prompt}}" --approval-mode yolo --skip-trust
      approve: headless mode treats ask-user as deny; yolo approves, --skip-trust admits the folder.
    list_check:
      template: gemini mcp list
      expect: '{{server}}'
    profile:
      name_format: mcp_{server}_{tool}
      max_name_length: 63
      server_forbidden_chars: _
      sources:
        - url: https://github.com/google-gemini/gemini-cli/blob/87de0b6/docs/tools/mcp-server.md
          accessed: 2026-09-24
          claim: >-
            httpUrl is streamable HTTP and url is SSE; tools are named mcp_<server>_<tool> and
            names over 63 characters are truncated; $schema, additionalProperties and anyOf
            defaults are stripped; server names must not contain an underscore
        - url: https://github.com/google-gemini/gemini-cli/blob/87de0b6/docs/cli/gemini-md.md
          accessed: 2026-09-24
          claim: context.fileName makes Gemini read AGENTS.md
    verified: null

  - id: copilot
    name: GitHub Copilot (CLI and VS Code)
    transport: streamable-http
    snippets:
      - title: Register the server with the Copilot CLI
        kind: command
        format: shell
        auth: none
        template: copilot mcp add --transport http {{server}} {{mcp_url}}
      - title: Or in the VS Code workspace (VS Code also reads the .mcp.json above)
        kind: file
        path: .vscode/mcp.json
        scope: project
        format: json
        auth: none
        required_keys: [servers.*.type, servers.*.url]
        template: '{"servers": {"{{server}}": {"type": "http", "url": "{{mcp_url}}"}}}'
      - title: With your write token, prompted for once and stored by VS Code
        kind: file
        path: .vscode/mcp.json
        scope: project
        format: json
        auth: bearer
        required_keys: [servers.*.type, servers.*.url, servers.*.headers, inputs]
        template: >-
          {"inputs": [{"type": "promptString", "id": "opn-token",
          "description": "Open Proof Network write token", "password": true}],
          "servers": {"{{server}}": {"type": "http", "url": "{{mcp_url}}",
          "headers": {"Authorization": "Bearer ${input:opn-token}"}}}}
    instructions:
      reads_agents_md: true
      how: Copilot in VS Code and the Copilot CLI both read AGENTS.md; nothing to add.
    headless:
      template: copilot -p "{{prompt}}" --allow-tool='{{server}}'
      approve: >-
        VS Code has no headless mode; the Copilot CLI reads the same files and stands in for it
        (F16-Q9).
    list_check:
      template: copilot mcp list
      expect: '{{server}}'
    profile:
      max_tools: 128
      sources:
        - url: https://github.com/microsoft/vscode-docs/blob/main/docs/agents/reference/mcp-configuration.md
          accessed: 2026-09-24
          claim: >-
            .vscode/mcp.json uses a top-level servers key with "type": "http"; secrets go in
            ${input:id}; 128 tools per chat request
        - url: https://github.com/github/docs/blob/main/content/copilot/how-tos/copilot-cli/customize-copilot/add-mcp-servers.md
          accessed: 2026-09-24
          claim: copilot mcp add --transport http <name> <url>
    verified: null

  - id: cursor
    name: Cursor
    transport: streamable-http
    snippets:
      - title: Add the server to the project
        kind: file
        path: .cursor/mcp.json
        scope: project
        format: json
        auth: none
        required_keys: [mcpServers.*.url]
        template: '{"mcpServers": {"{{server}}": {"url": "{{mcp_url}}"}}}'
      - title: With your write token (a forum report says Cursor drops headers on tool calls)
        kind: file
        path: .cursor/mcp.json
        scope: project
        format: json
        auth: bearer
        required_keys: [mcpServers.*.url, mcpServers.*.headers]
        template: >-
          {"mcpServers": {"{{server}}": {"url": "{{mcp_url}}",
          "headers": {"Authorization": "Bearer ${env:{{token_env}}}"}}}}
    instructions:
      reads_agents_md: true
      how: Cursor reads AGENTS.md beside its own rules (unverified against Cursor's own docs).
    headless:
      template: agent -p "{{prompt}}" --approve-mcps --force
      approve: --approve-mcps is needed for print mode to load MCP tools (unverified).
    list_check:
      template: agent mcp list
      expect: '{{server}}'
    profile:
      max_tools: 40
      sources:
        - url: https://cursor.com/docs/mcp
          accessed: 2026-09-24
          claim: >-
            UNVERIFIED (search snippets only; the page was unreachable): url plus headers in
            .cursor/mcp.json, ${env:NAME} expansion, at most 40 tools across all servers
    verified: null
